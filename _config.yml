# ─────────────────────────────────────────────
# サイト全体の設定。変更後は GitHub に push すると数分で反映される。
# ─────────────────────────────────────────────
title: 北大珈琲研究会
title_en: Hokkaido University Coffee Society
description: 北海道大学珈琲研究会です。大学生にスペシャルティコーヒーを広めるサークル。手づくりの道具と自家焙煎豆の販売、例会のブログ。
lang: ja
url: "https://gmgngnm.github.io"   # 独自ドメインにしたらここを書き換える
baseurl: "/hu_coffee"              # 独自ドメインにしたら "" にする

instagram: hu_coffee
threads: hu_coffee
image: /assets/img/og.png         # SNS で共有したときに出る画像

# ── 外部サービス（未設定なら空のまま。空だと該当機能は読み込まれない）──
# Google アナリティクス 4 の測定ID（例: G-XXXXXXXXXX）
google_analytics: ""
# Formspree のフォームID（https://formspree.io/f/xxxxabcd の xxxxabcd 部分）
formspree_contact: ""
# オンラインショップ（BASE や STORES など）のトップページのURL。商品ごとの購入ページが
# 未設定のとき、ここへ案内する。空欄ならショップは「準備中」と表示する
shop_url: ""
# 出店予定に使っている Google カレンダーの公開ページ（「カレンダーで見る」のリンク先）。空なら出さない
calendar_url: ""
# 予備の連絡先メール（フォーム未設定のときに案内として表示）
contact_email: ""

timezone: Asia/Tokyo
permalink: /blog/:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "proposals" }
    values: { sitemap: false }

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - cms-auth
  - assets/js/phrase.src.js
  - scripts
