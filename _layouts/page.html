---
layout: default
---
<article class="wrap prose-page">
  <header class="page-head">
    {% if page.label %}<p class="label">{{ page.label }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
