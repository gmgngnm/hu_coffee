# ─────────────────────────────────────────────
# SHOP の商品。管理画面（/admin/）の「サイトの情報 → 商品」からも編集できる。
#   icon:    写真が無いときに出す線画の種類（dripper / dripbag / beans / aroma / spoon / cup）
#   image:   商品の写真（assets/img/products/ に置く。横4:縦3）
#   price:   価格（円）。未定なら空欄
#   options: 選べる種類（例：豆のまま、挽き豆）。無ければ空のまま
#   buy_url: その商品の購入ページ（BASE や STORES の商品URL）。
#            空欄なら _config.yml の shop_url（ショップのトップ）へ案内する
#   status:  available（販売中） / soon（準備中） / soldout（売り切れ）
# ※ 説明文と価格は仮です。実際の内容に差し替えてください。
# ─────────────────────────────────────────────
