{%- assign here = page.nav | default: "" -%}
<header class="site-head">
  <div class="site-head__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand__logo" src="{{ '/assets/img/logo.png' | relative_url }}" width="872" height="356" alt="">
      <span class="brand__text">
        <span class="brand__ja">北大珈琲研究会</span>
        <span class="brand__en">HOKUDAI COFFEE SOCIETY</span>
      </span>
    </a>
  </div>
  <nav class="tabs" aria-label="ページ切り替え">
    <ul class="tabs__list">
      <li><a class="tab{% if here == 'home' %} is-current{% endif %}" href="{{ '/' | relative_url }}"{% if here == 'home' %} aria-current="page"{% endif %}><span class="tab__no">01</span>ホーム</a></li>
      <li><a class="tab{% if here == 'beans' %} is-current{% endif %}" href="{{ '/beans/' | relative_url }}"{% if here == 'beans' %} aria-current="page"{% endif %}><span class="tab__no">02</span>焙煎豆</a></li>
      <li><a class="tab{% if here == 'blog' %} is-current{% endif %}" href="{{ '/blog/' | relative_url }}"{% if here == 'blog' %} aria-current="page"{% endif %}><span class="tab__no">03</span>記録</a></li>
      <li><a class="tab{% if here == 'about' %} is-current{% endif %}" href="{{ '/about/' | relative_url }}"{% if here == 'about' %} aria-current="page"{% endif %}><span class="tab__no">04</span>私たち</a></li>
      <li><a class="tab{% if here == 'contact' %} is-current{% endif %}" href="{{ '/contact/' | relative_url }}"{% if here == 'contact' %} aria-current="page"{% endif %}><span class="tab__no">05</span>お問い合わせ</a></li>
    </ul>
  </nav>
</header>
