{%- assign here = page.nav | default: "" -%}
<header class="site-head">
  <div class="site-head__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand__logo" src="{{ '/assets/img/logo.png' | relative_url }}" width="872" height="356" alt="">
      <span class="brand__sign" role="img" aria-label="hu_coffee"></span>
      <span class="vh">北大珈琲研究会</span>
    </a>
  </div>
  <nav class="tabs" aria-label="ページ切り替え">
    <ul class="tabs__list">
      <li><a class="tab{% if here == 'home' %} is-current{% endif %}" href="{{ '/' | relative_url }}"{% if here == 'home' %} aria-current="page"{% endif %}><span class="tab__label" lang="en">home</span></a></li>
      <li><a class="tab{% if here == 'shop' %} is-current{% endif %}" href="{{ '/shop/' | relative_url }}"{% if here == 'shop' %} aria-current="page"{% endif %}><span class="tab__label" lang="en">shop</span></a></li>
      <li><a class="tab{% if here == 'blog' %} is-current{% endif %}" href="{{ '/blog/' | relative_url }}"{% if here == 'blog' %} aria-current="page"{% endif %}><span class="tab__label" lang="en">blog</span></a></li>
      <li><a class="tab{% if here == 'about' %} is-current{% endif %}" href="{{ '/about/' | relative_url }}"{% if here == 'about' %} aria-current="page"{% endif %}><span class="tab__label" lang="en">about</span></a></li>
      <li><a class="tab{% if here == 'contact' %} is-current{% endif %}" href="{{ '/contact/' | relative_url }}"{% if here == 'contact' %} aria-current="page"{% endif %}><span class="tab__label" lang="en">contact</span></a></li>
    </ul>
  </nav>
</header>
