<footer class="site-foot">
  <div class="poplars" aria-hidden="true"></div>
  <div class="site-foot__inner">
    <div class="site-foot__col">
      <p class="site-foot__name">北大珈琲研究会</p>
      <p class="site-foot__sub">Hokkaido University Coffee Society<br>札幌市北区 北海道大学 札幌キャンパス</p>
    </div>
    <div class="site-foot__col site-foot__sns">
      <a class="insta" href="https://www.instagram.com/{{ site.instagram }}/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/></svg>
        <span>@{{ site.instagram }}</span>
        <span class="insta__hint">焙煎日や出店のお知らせはこちら</span>
      </a>
      {%- if site.threads %}
      <a class="insta" href="https://www.threads.com/@{{ site.threads }}" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M16.6 11.1c-.4-2.6-2.1-3.9-4.5-3.9-2.2 0-3.7 1.2-4 3"/><path d="M16.8 11.4c-1.6-.9-6.4-1.1-6.4 1.7 0 1.4 1.3 2.1 2.7 2 2.1-.2 3.4-1.8 3.4-4.3 0-4.3-2.4-6.6-6.1-6.6C6.1 4.2 4 7 4 12s2.2 7.8 6.5 7.8c3.3 0 5.6-1.4 6.6-3.6"/></svg>
        <span>@{{ site.threads }}</span>
        <span class="insta__hint">Threads でもつぶやいています</span>
      </a>
      {%- endif %}
    </div>
    <ul class="site-foot__links">
      <li><a href="{{ '/privacy/' | relative_url }}">プライバシーポリシー</a></li>
      <li><a href="{{ '/legal/' | relative_url }}">特定商取引法に基づく表記</a></li>
      <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
    </ul>
  </div>
  <p class="site-foot__copy">© {{ site.time | date: "%Y" }} 北大珈琲研究会　本サイトは学生団体が運営する非公式サイトです。</p>
</footer>
