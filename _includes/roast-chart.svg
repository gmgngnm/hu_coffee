<svg class="chart" viewBox="0 0 520 300" role="img" aria-labelledby="chart-t">
  <title id="chart-t">焙煎記録の例：豆温度の推移。投入後に一度下がり、約9分で1ハゼ、約11分で煎り止め。</title>
  <defs>
    <pattern id="g-s" width="13" height="13" patternUnits="userSpaceOnUse"><path d="M13 0H0V13" fill="none" stroke="var(--grid)" stroke-width=".6"/></pattern>
    <pattern id="g-l" width="65" height="65" patternUnits="userSpaceOnUse"><rect width="65" height="65" fill="url(#g-s)"/><path d="M65 0H0V65" fill="none" stroke="var(--grid-strong)" stroke-width=".9"/></pattern>
  </defs>
  <rect x="40" y="10" width="455" height="250" fill="url(#g-l)"/>
  <g class="chart__axis" font-size="10">
    <text x="34" y="14" text-anchor="end">240</text><text x="34" y="79" text-anchor="end">200</text><text x="34" y="144" text-anchor="end">160</text><text x="34" y="209" text-anchor="end">120</text>
    <text x="40" y="276">0</text><text x="170" y="276" text-anchor="middle">4</text><text x="300" y="276" text-anchor="middle">8</text><text x="430" y="276" text-anchor="middle">12 min</text>
    <text x="8" y="140" transform="rotate(-90 8 140)" text-anchor="middle">豆温度 ℃</text>
  </g>
  <path class="chart__line chart__line--sub" d="M40 30 C 90 60, 150 70, 220 82 S 360 100, 440 112"/>
  <path class="chart__line" d="M40 40 C 52 190, 70 215, 92 214 C 130 212, 170 176, 215 146 C 260 118, 300 98, 330 86 C 360 76, 390 64, 412 56"/>
  <g class="chart__note">
    <circle cx="92" cy="214" r="3.5"/><text x="100" y="232">中点 1:36</text>
    <path d="M330 86 v-40" /><circle cx="330" cy="86" r="3.5"/><text x="336" y="44">1ハゼ 9:12</text>
    <circle cx="412" cy="56" r="4.5" class="chart__stop"/><text x="420" y="78">煎り止め 11:24</text>
  </g>
  <g class="chart__legend"><path d="M300 236h18" stroke="var(--bean)"/><text x="322" y="239">豆温度</text><path d="M372 236h18" stroke="var(--accent)" stroke-dasharray="4 4"/><text x="394" y="239">排気温度</text></g>
  <text class="chart__hand" x="140" y="120">ここで火を弱める</text>
  <path class="chart__hand-arrow" d="M214 126 q 6 10 2 18"/>
</svg>
